name: Pløtline website checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  privacy-flow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check plotline-delete.js
      - run: node --test tests/plotline-delete.test.cjs
      - run: python3 scripts/verify_plotline_links.py
      - run: python3 scripts/verify_protected_links.py
